<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord — Prospects Gabreal Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F7F4EF; font-family: 'Inter', system-ui, sans-serif; color: #26241F; }
  header { padding: 24px 40px; border-bottom: 1px solid #E7E1D5; display: flex; align-items: center; justify-content: space-between; }
  h1 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; margin: 0; }
  main { padding: 32px 40px; max-width: 1100px; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; background: #FFFFFF; border: 1px solid #E7E1D5; border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #F0EBDE; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: #8C867A; background: #FAF7F1; }
  tr:last-child td { border-bottom: none; }
  .empty { padding: 40px; text-align: center; color: #8C867A; font-size: 14px; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #EFE8D8; color: #6B4F28; }
</style>
</head>
<body>
<header>
  <h1>Prospects — Gabreal Estate</h1>
</header>
<main>
  <table id="leads-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Nom</th>
        <th>Téléphone</th>
        <th>E-mail</th>
        <th>Source</th>
        <th>Statut</th>
      </tr>
    </thead>
    <tbody id="leads-body"></tbody>
  </table>
  <div class="empty" id="empty-msg" style="display:none;">Aucun prospect pour le moment.</div>
</main>
<script>
  fetch('/api/leads')
    .then(function (r) { return r.json(); })
    .then(function (leads) {
      var body = document.getElementById('leads-body');
      if (!leads.length) {
        document.getElementById('leads-table').style.display = 'none';
        document.getElementById('empty-msg').style.display = 'block';
        return;
      }
      leads.forEach(function (lead) {
        var tr = document.createElement('tr');
        var date = new Date(lead.createdAt).toLocaleString('fr-FR');
        tr.innerHTML =
          '<td>' + date + '</td>' +
          '<td>' + (lead.name || '') + '</td>' +
          '<td>' + (lead.phone || '') + '</td>' +
          '<td>' + (lead.email || '') + '</td>' +
          '<td>' + (lead.source || '') + '</td>' +
          '<td><span class="badge">' + (lead.status || 'nouveau') + '</span></td>';
        body.appendChild(tr);
      });
    });
</script>
</body>
</html>
